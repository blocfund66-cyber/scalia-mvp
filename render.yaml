services:
  - type: web
    name: scalia
    runtime: static
    buildCommand: "npm --prefix scalia-react install && npm --prefix scalia-react run build"
    staticPublishPath: scalia-react/dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
