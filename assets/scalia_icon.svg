<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Neural Circuit Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(16, 185, 129, 0.2)" stroke-width="2" />

  <!-- Core Diamond Shield -->
  <g filter="url(#glow)">
    <rect x="168" y="168" width="176" height="176" rx="42" fill="url(#primaryGrad)" transform="rotate(45 256 256)" opacity="0.95" />
  </g>

  <!-- Inner Tech Emblem -->
  <circle cx="256" cy="256" r="32" fill="#ffffff" />
  <circle cx="256" cy="186" r="14" fill="url(#accentGrad)" />
  <circle cx="256" cy="326" r="14" fill="url(#accentGrad)" />
  <circle cx="186" cy="256" r="14" fill="url(#accentGrad)" />
  <circle cx="326" cy="256" r="14" fill="url(#accentGrad)" />

  <!-- Connecting Data Lines -->
  <line x1="256" y1="224" x2="256" y2="200" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="256" y1="288" x2="256" y2="312" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="224" y1="256" x2="200" y2="256" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="288" y1="256" x2="312" y2="256" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
</svg>