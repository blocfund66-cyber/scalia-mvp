<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="scaliaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a86b" />
      <stop offset="28%" stop-color="#059669" />
      <stop offset="68%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- iOS-style Squircle background -->
  <rect width="512" height="512" rx="112" fill="url(#scaliaGradient)" />

  <!-- Scalia Hexagon + Y Emblem -->
  <g filter="url(#shadow)">
    <!-- Pointy-topped regular hexagonal frame -->
    <polygon points="256,120 374,188 374,324 256,392 138,324 138,188"
             fill="none" stroke="#ffffff" stroke-width="36" stroke-linejoin="round" />

    <!-- Center Y emblem with thick rounded caps -->
    <path d="M205,216 L256,252 L307,216 M256,252 L256,310"
          fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>